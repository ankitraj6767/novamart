services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["novamart-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  typesense:
    image: typesense/typesense:0.25.2
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_ADMIN_API_KEY:-local-typesense-key}", "--listen-port", "8108"]
    ports: ["8108:8108"]
    volumes: ["novamart-typesense:/data"]
    healthcheck:
      # The Typesense image includes bash but not wget/curl. Keep the check HTTP-level
      # so the container is only healthy when the Typesense server is accepting requests.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  novamart-redis:
  novamart-typesense:
